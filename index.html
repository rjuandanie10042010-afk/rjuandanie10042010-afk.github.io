<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a0d11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png?v=012">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css?v=012">
  <title>SonicStage Pro</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // localhost deliberately does not use a service worker while developing.
    // This prevents stale caches from making a stage build appear broken.
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('sonicstage-pro-')).map(k => caches.delete(k)))).catch(() => {});
      }
    }
  </script>
  <script type="module" src="/app.js?v=012"></script>
</body>
</html>
